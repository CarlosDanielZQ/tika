name: main jdk17 build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, tache3-semgrep ]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:
  # IFT3913 - Tache 3 : controle de securite execute AVANT le build.
  # Si les commits introduisent une nouvelle alerte Semgrep, ce job echoue,
  # le job build (needs: semgrep) n'est pas lance et le workflow est en echec.
  semgrep:
    name: Semgrep Security Scan
    permissions:
      contents: read
    uses: ./.github/workflows/semgrep-diff.yml
    with:
      config: p/java

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: semgrep
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        id: maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      # IFT3913 - Tache 3 : rickroll si au moins un cas de test a echoue.
      - name: Rickroll on test failure
        if: failure() && steps.maven.outcome == 'failure'
        uses: ./.github/actions/rickroll
        with:
          reports: "**/target/surefire-reports/TEST-*.xml"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Run E2E Tests
        id: e2e
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      - name: Rickroll on test failure
        if: failure() && steps.e2e.outcome == 'failure'
        uses: ./.github/actions/rickroll
        with:
          reports: "**/target/surefire-reports/TEST-*.xml **/target/failsafe-reports/TEST-*.xml"
