name: Semgrep Validation

on:
  push:
    branches:
      - tache3-semgrep

jobs:
  semgrep:
    name: Semgrep Differential Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: python -m pip install semgrep


      - name: List all Semgrep Java rules
        run: |
          semgrep scan --config p/java --metrics=off \
            --dump-config > semgrep-config.yml

          python - <<'PY'
          import yaml

          with open("semgrep-config.yml", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          rules = data.get("rules", [])
          print(f"Nombre de règles : {len(rules)}")

          for rule in rules:
              print(rule.get("id", "Identifiant inconnu"))
          PY



      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --baseline-commit "$(git merge-base HEAD origin/main)" \
            --error \
            --metrics=off \
            .