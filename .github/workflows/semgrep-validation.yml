name: Semgrep Validation

on:
  push:
    branches:
      - tache3-semgrep

jobs:
  semgrep:
    name: Semgrep Differential Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: List Semgrep Java rules
        run: |
          semgrep scan --config p/java --metrics=off --json \
            tika-core/src/main/java/org/apache/tika/SemgrepSecurityDemo.java \
            > semgrep-rules.json || true

          python - <<'PY'
          import json
          with open("semgrep-rules.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Règles ayant produit des résultats :")
          for rule in sorted({r["check_id"] for r in data.get("results", [])}):
              print(rule)
          PY

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --baseline-commit "$(git merge-base HEAD origin/main)" \
            --error \
            --metrics=off \
            .