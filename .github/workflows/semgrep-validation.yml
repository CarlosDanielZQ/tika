name: Semgrep Validation

on:
  push:
    branches:
      - tache3-semgrep

jobs:
  semgrep:
    name: Semgrep Differential Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: python -m pip install semgrep


      - name: List all Semgrep Java rules
        run: |
          semgrep scan --config p/java --metrics=off \
            --validate --json > semgrep-config.json

          python - <<'PY'
          import json

          with open("semgrep-config.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Résultat de la validation Semgrep :")
          print(json.dumps(data, indent=2))
          PY


      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --baseline-commit "$(git merge-base HEAD origin/main)" \
            --error \
            --metrics=off \
            .